<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page Not Found — CareerLens</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to CareerLens — AI-Powered Career Intelligence Platform.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://careerlens.in/">
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #0f0f1a 0%, #1a0a2e 100%); font-family: 'Inter', sans-serif; }
    .error-box { text-align: center; padding: 3rem 2rem; max-width: 500px; }
    .error-code { font-size: 7rem; font-weight: 900; background: linear-gradient(135deg, #7C3AED, #06B6D4);
                  -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .error-title { color: #fff; font-size: 1.8rem; font-weight: 700; margin: 1rem 0 0.5rem; }
    .error-msg { color: #a0a0b8; font-size: 1rem; margin-bottom: 2rem; }
    .btn-home { display: inline-block; padding: 0.8rem 2rem; background: linear-gradient(135deg, #7C3AED, #5B21B6);
                color: #fff; border-radius: 50px; text-decoration: none; font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s; }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124,58,237,0.4); }
  </style>
</head>
<body>
  <div class="error-box">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">The page you're looking for doesn't exist or has been moved.<br>Let's get you back on track.</p>
    <a href="/" class="btn-home">🔍 Back to CareerLens</a>
  </div>
</body>
</html>
